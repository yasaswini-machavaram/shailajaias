name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_and_typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turbo Check-Types
        run: pnpm run check-types:all

      - name: Run Turbo Lint
        run: pnpm run lint:all

  build_and_deploy_api:
    name: Build & Push API Image
    needs: lint_and_typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (if secrets configured)
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR (if configured)
        if: env.AWS_ACCESS_KEY_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Build API Docker Image
        run: |
          docker build -t shailaja-api:latest -f apps/api/Dockerfile .

      - name: Push to Amazon ECR (if configured)
        if: env.AWS_ACCESS_KEY_ID != '' && env.APPRUNNER_SERVICE_ARN != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag shailaja-api:latest $REGISTRY/shailaja-api:latest
          docker tag shailaja-api:latest $REGISTRY/shailaja-api:${{ github.sha }}
          docker push $REGISTRY/shailaja-api:latest
          docker push $REGISTRY/shailaja-api:${{ github.sha }}
          aws apprunner start-deployment --service-arn $APPRUNNER_SERVICE_ARN
